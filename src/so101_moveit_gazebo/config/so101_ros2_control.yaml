controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    so101_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    so101_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    so101_gripper_controller:
      type: effort_controllers/JointGroupEffortController

so101_arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_roll
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

so101_gripper_controller:
  ros__parameters:
    joints:
      - gripper
